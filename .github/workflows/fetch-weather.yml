
name: Fetch Weather Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather and save
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json
          from datetime import datetime, timezone

          lat, lon = 25.41, -82.53
          result = {"updated": datetime.now(timezone.utc).isoformat(), "lat": lat, "lon": lon, "forecast": None, "marine": None}

          try:
            url = ("https://api.open-meteo.com/v1/forecast?latitude={}&longitude={}"
                   "&daily=wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,"
                   "precipitation_probability_max,weather_code"
                   "&hourly=wind_speed_10m,wind_direction_10m,precipitation_probability,weather_code"
                   "&wind_speed_unit=kn&timezone=America/New_York&forecast_days=7").format(lat, lon)
            result["forecast"] = json.loads(urllib.request.urlopen(url, timeout=20).read())
            print("Forecast OK")
          except Exception as e:
            print("Forecast error:", e)

          try:
            url2 = ("https://marine-api.open-meteo.com/v1/marine?latitude={}&longitude={}"
                    "&daily=wave_height_max,wave_period_max,wave_direction_dominant"
                    "&timezone=America/New_York&forecast_days=7").format(lat, lon)
            result["marine"] = json.loads(urllib.request.urlopen(url2, timeout=20).read())
            print("Marine OK")
          except Exception as e:
            print("Marine error:", e)

          with open("weather.json", "w") as f:
            json.dump(result, f)
          print("Done:", result["updated"])
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --staged --quiet || git commit -m "Weather update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
